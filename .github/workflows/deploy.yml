## Builds the site and publishes dist/ to GitHub Pages.
##
## Pages cannot build a Vite app on its own. Pointing it at a branch just
## serves the raw source, which means the browser gets src/main.jsx as
## text/jsx and nothing renders. This workflow runs the build first.
##
## Requires: Settings → Pages → Source → "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but a new push wins.
#
# The official Pages starter uses cancel-in-progress: false so production
# deploys always finish. That deadlocks: if a run wedges (GitHub can create
# the deployment and then never transition it out of "waiting"), every later
# push queues behind it indefinitely and the only way out is cancelling by
# hand in the Actions tab. For a static résumé site a superseded deploy is
# worth nothing, so let the newest push cancel whatever is pending.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Default is 360 minutes. A wedged deploy would hang for six hours
    # looking like it was still working; fail loudly in ten instead.
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
